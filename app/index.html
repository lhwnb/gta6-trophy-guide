<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTA VI Trophy Guide -- Leonida, 55 trophies, one playthrough</title>
<meta name="description" content="A complete, offline trophy guide for Grand Theft Auto VI: 55 trophies, a roadmap to the platinum, nine missables and a per-trophy walkthrough.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="mark">VI</span>
    <div class="brandtext">
      <p class="kicker">Grand Theft Auto VI &middot; Leonida</p>
      <h1>Trophy Guide</h1>
    </div>
  </div>

  <div class="progress">
    <div class="count"><b id="doneCount">0</b><span class="of">/55</span><span class="plabel">ticked</span></div>
    <div class="pwrap">
      <div class="bar"><i id="doneBar"></i></div>
      <div class="bygrade" id="gradeBreak"></div>
    </div>
  </div>

  <div class="topright">
    <div class="tabs" id="tabs" role="tablist" aria-label="Views">
      <button data-view="checklist" class="on" role="tab" aria-selected="true">Checklist</button>
      <button data-view="roadmap" role="tab" aria-selected="false">Roadmap</button>
      <button data-view="missables" role="tab" aria-selected="false">Missables</button>
    </div>
    <label class="switch" title="Blur story spoilers until you click them">
      <input type="checkbox" id="spoilers">
      <span class="track"><i></i></span>
      <span class="slabel" id="spoilerLabel">Hide spoilers</span>
    </label>
  </div>
</header>

<div class="filters" id="filters">
  <div class="chipset" id="gradeChips" role="group" aria-label="Grade">
    <button class="chip on" data-grade="all">All 55</button>
    <button class="chip" data-grade="platinum">Platinum</button>
    <button class="chip" data-grade="gold">Gold</button>
    <button class="chip" data-grade="silver">Silver</button>
    <button class="chip" data-grade="bronze">Bronze</button>
  </div>

  <button class="chip toggle" id="missableChip" aria-pressed="false">Missable only</button>

  <label class="sel"><select id="chapterSel" aria-label="Chapter"></select></label>
  <label class="sel"><select id="diffSel" aria-label="Difficulty"></select></label>
  <label class="search"><input id="q" type="search" placeholder="Search names, missions" autocomplete="off" aria-label="Search"></label>
  <label class="sel"><select id="sortSel" aria-label="Sort"></select></label>

  <span class="shown" id="shownCount"></span>
</div>

<main>
  <section id="view-checklist" class="view on" aria-label="Checklist">
    <div class="listpane">
      <div class="listhead"><span id="listHeadLabel">All trophies</span><span class="sp" id="listHeadCount"></span></div>
      <ul id="list" class="list"></ul>
    </div>
    <aside class="detail" id="detail" aria-live="polite"></aside>
  </section>

  <section id="view-roadmap" class="view" aria-label="Roadmap">
    <div class="rm-left" id="rmLeft"></div>
    <div class="rm-right" id="rmRight"></div>
  </section>

  <section id="view-missables" class="view" aria-label="Missables">
    <div class="mlistpane">
      <div class="listhead"><span>Missable trophies</span><span class="sp" id="missHeadCount">9</span></div>
      <ul id="mlist"></ul>
      <p class="mfoot" id="missFoot"></p>
    </div>
    <aside class="mdetail" id="mdetail" aria-live="polite"></aside>
  </section>
</main>

<script src="data/data.js"></script>
<script src="app.js"></script>
</body>
</html>
